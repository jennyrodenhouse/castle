<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#2c3e50"/>
  <rect width="800" height="200" y="400" fill="#34495e"/>

  <!-- Castle Door (on the right) -->
  <g id="door">
    <rect x="650" y="300" width="100" height="150" fill="#8B4513" stroke="#654321" stroke-width="3"/>
    <rect x="655" y="305" width="90" height="140" fill="#A0522D"/>
    <line x1="650" y1="340" x2="750" y2="340" stroke="#654321" stroke-width="2"/>
    <line x1="650" y1="380" x2="750" y2="380" stroke="#654321" stroke-width="2"/>
    <circle cx="730" cy="375" r="5" fill="#FFD700"/>
    <rect x="640" y="280" width="120" height="20" fill="#7a3f1f"/>
    <rect x="640" y="450" width="120" height="10" fill="#654321"/>
  </g>

  <!-- Hero Character (starts on the left) -->
  <g id="hero">
    <!-- Body -->
    <ellipse cx="100" cy="380" rx="20" ry="30" fill="#e74c3c"/>
    <!-- Head -->
    <circle cx="100" cy="340" r="18" fill="#f0c9a8"/>
    <!-- Eyes -->
    <circle cx="95" cy="338" r="2" fill="#000"/>
    <circle cx="105" cy="338" r="2" fill="#000"/>
    <!-- Smile -->
    <path d="M 95 345 Q 100 348 105 345" stroke="#000" stroke-width="1" fill="none"/>
    <!-- Arms -->
    <line x1="85" y1="365" x2="70" y2="380" stroke="#f0c9a8" stroke-width="5" stroke-linecap="round"/>
    <line x1="115" y1="365" x2="130" y2="380" stroke="#f0c9a8" stroke-width="5" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="95" y1="410" x2="90" y2="440" stroke="#3498db" stroke-width="6" stroke-linecap="round"/>
    <line x1="105" y1="410" x2="110" y2="440" stroke="#3498db" stroke-width="6" stroke-linecap="round"/>
    <!-- Feet -->
    <ellipse cx="88" cy="442" rx="8" ry="4" fill="#2c3e50"/>
    <ellipse cx="112" cy="442" rx="8" ry="4" fill="#2c3e50"/>
  </g>

  <!-- Shield (equipment for hero) -->
  <g id="Shield">
    <path d="M 95 355 L 85 365 L 85 385 Q 90 395 95 395 Q 100 395 105 395 Q 110 395 115 385 L 115 365 Z" fill="#C0C0C0" stroke="#808080" stroke-width="2"/>
    <line x1="95" y1="360" x2="105" y2="390" stroke="#FFD700" stroke-width="2"/>
    <line x1="105" y1="360" x2="95" y2="390" stroke="#FFD700" stroke-width="2"/>
    <circle cx="100" cy="375" r="6" fill="#FFD700"/>
  </g>

  <!-- Tie (equipment for hero) -->
  <g id="tie">
    <polygon points="100,350 95,355 95,375 100,385 105,375 105,355" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
    <rect x="97" y="348" width="6" height="4" fill="#c0392b"/>
    <line x1="100" y1="355" x2="100" y2="382" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Helmet (equipment for hero) -->
  <g id="helmet">
    <ellipse cx="100" cy="332" rx="22" ry="16" fill="#C0C0C0" stroke="#808080" stroke-width="2"/>
    <rect x="78" y="332" width="44" height="8" fill="#C0C0C0" stroke="#808080" stroke-width="2"/>
    <polygon points="100,320 95,328 105,328" fill="#FFD700"/>
    <circle cx="100" cy="325" r="3" fill="#ff0000"/>
  </g>

  <!-- Control Buttons (bottom of screen) -->
  <g id="shield-btn">
    <rect x="50" y="520" width="120" height="60" rx="10" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="110" y="555" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">SHIELD</text>
  </g>

  <g id="tie-btn">
    <rect x="200" y="520" width="120" height="60" rx="10" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="260" y="555" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">TIE</text>
  </g>

  <g id="helmet-btn">
    <rect x="350" y="520" width="120" height="60" rx="10" fill="#95a5a6" stroke="#7f8c8d" stroke-width="3"/>
    <text x="410" y="555" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">HELMET</text>
  </g>

  <!-- Instructions -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ecf0f1" text-anchor="middle">Castle Adventure</text>
  <text x="400" y="55" font-family="Arial, sans-serif" font-size="14" fill="#bdc3c7" text-anchor="middle">Equip your hero, then click the door to begin!</text>
</svg>
