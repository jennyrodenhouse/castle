<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#2196F3"/>
  <g fill="#ffffff">
    <!-- Castle towers -->
    <rect x="80" y="150" width="80" height="280"/>
    <rect x="352" y="150" width="80" height="280"/>

    <!-- Main castle body -->
    <rect x="160" y="200" width="192" height="230"/>

    <!-- Tower tops -->
    <rect x="70" y="130" width="100" height="20"/>
    <rect x="342" y="130" width="100" height="20"/>

    <!-- Crenellations -->
    <rect x="70" y="120" width="20" height="20"/>
    <rect x="110" y="120" width="20" height="20"/>
    <rect x="150" y="120" width="20" height="20"/>

    <rect x="342" y="120" width="20" height="20"/>
    <rect x="382" y="120" width="20" height="20"/>
    <rect x="422" y="120" width="20" height="20"/>

    <!-- Main wall crenellations -->
    <rect x="160" y="180" width="25" height="30"/>
    <rect x="210" y="180" width="25" height="30"/>
    <rect x="260" y="180" width="25" height="30"/>
    <rect x="310" y="180" width="25" height="30"/>

    <!-- Door -->
    <rect x="226" y="330" width="60" height="100" fill="#1976D2"/>
    <rect x="226" y="340" width="60" height="40" rx="30" fill="#1565C0"/>

    <!-- Windows -->
    <rect x="190" y="250" width="30" height="40" fill="#1976D2"/>
    <rect x="292" y="250" width="30" height="40" fill="#1976D2"/>
    <rect x="100" y="200" width="25" height="35" fill="#1976D2"/>
    <rect x="372" y="200" width="25" height="35" fill="#1976D2"/>

    <!-- Tower windows -->
    <rect x="100" y="280" width="25" height="35" fill="#1976D2"/>
    <rect x="372" y="280" width="25" height="35" fill="#1976D2"/>
  </g>
</svg>
